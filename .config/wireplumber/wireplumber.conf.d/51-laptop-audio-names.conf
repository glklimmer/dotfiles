# Names the laptop's built-in SOF sound card ("sof-hda-dsp ...") after what each
# output and input is, in the same "<machine> - <device>" style as the PC devices
# that `dock on` adds.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card\\..*skl_hda_dsp_generic" } ]
    actions = { update-props = { device.description = "Laptop" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\..*skl_hda_dsp_generic\\.HiFi__Speaker__sink" } ]
    actions = { update-props = { node.description = "Laptop - Speakers" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\..*skl_hda_dsp_generic\\.HiFi__Headphones__sink" } ]
    actions = { update-props = { node.description = "Laptop - Headphones" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\..*skl_hda_dsp_generic\\.HiFi__HDMI1__sink" } ]
    actions = { update-props = { node.description = "Laptop - HDMI / DisplayPort 1" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\..*skl_hda_dsp_generic\\.HiFi__HDMI2__sink" } ]
    actions = { update-props = { node.description = "Laptop - HDMI / DisplayPort 2" } }
  }
  {
    matches = [ { node.name = "~alsa_output\\..*skl_hda_dsp_generic\\.HiFi__HDMI3__sink" } ]
    actions = { update-props = { node.description = "Laptop - HDMI / DisplayPort 3" } }
  }
  {
    matches = [ { node.name = "~alsa_input\\..*skl_hda_dsp_generic\\.HiFi__Mic1__source" } ]
    actions = { update-props = { node.description = "Laptop - Microphone" } }
  }
  {
    matches = [ { node.name = "~alsa_input\\..*skl_hda_dsp_generic\\.HiFi__Mic2__source" } ]
    actions = { update-props = { node.description = "Laptop - Headset Microphone" } }
  }
]
